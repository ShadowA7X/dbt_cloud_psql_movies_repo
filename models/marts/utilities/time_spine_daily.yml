version: 2

models:
  - name: time_spine_daily
    description: "Time spine table with one row per day. Used by dbt Semantic Layer (MetricFlow) to power time-based metrics."

    time_spine:
      standard_granularity_column: date_day

    columns:
      - name: date_day
        description: "Calendar day used as the canonical timeline for metrics."
        granularity: day
        tests:
          - not_null
          - unique