semantic_models:
  - name: sales_payments
    model: ref('fct_sales_payments')
    description: "One row per payment (payment_id)."

    defaults:
      agg_time_dimension: payment_day

    entities:
      - name: payment
        type: primary
        expr: payment_id

      - name: store
        type: foreign
        expr: store_id

      - name: film
        type: foreign
        expr: film_id

      - name: category
        type: foreign
        expr: category_id

    dimensions:
      - name: payment_day
        type: time
        type_params:
          time_granularity: day

    measures:
      - name: revenue
        agg: sum
        expr: revenue_amount

      - name: payment_count
        agg: count_distinct
        expr: payment_id
