version: 2

sources:
  - name: pagila
    database: pagila
    schema: public
    description: "PostgreSQL sample database inspired by Sakila. Contains a DVD rental store schema."

    tables:
      - name: actor
        description: "Stores actor information."
        columns:
          - name: actor_id
            description: "Primary key for actor."
            tests:
              - unique
              - not_null
          - name: first_name
            description: "Actor's first name."
          - name: last_name
            description: "Actor's last name."
          - name: last_update
            description: "Last update timestamp."

      - name: address
        description: "Customer and store addresses."
        columns:
          - name: address_id
            description: "Primary key for address."
            tests:
              - unique
              - not_null
          - name: address
            description: "First line of address."
          - name: address2
            description: "Second address line (optional)."
          - name: district
            description: "District or region."
          - name: city_id
            description: "Foreign key to city."
          - name: postal_code
            description: "Postal or ZIP code."
          - name: phone
            description: "Phone number."
          - name: last_update
            description: "Last update timestamp."

      - name: category
        description: "Film category definitions."
        columns:
          - name: category_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: name
            description: "Category name."
          - name: last_update
            description: "Last update timestamp."

      - name: city
        description: "City-level location information."
        columns:
          - name: city_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: city
            description: "City name."
          - name: country_id
            description: "Foreign key to country."
          - name: last_update
            description: "Last update timestamp."

      - name: country
        description: "Country definitions."
        columns:
          - name: country_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: country
            description: "Country name."
          - name: last_update
            description: "Last update timestamp."

      - name: customer
        description: "Customers of the rental service."
        columns:
          - name: customer_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: store_id
            description: "Store the customer belongs to."
          - name: first_name
            description: "First name of the customer."
          - name: last_name
            description: "Last name of the customer."
          - name: email
            description: "Customer email address."
          - name: address_id
            description: "Foreign key to address."
          - name: activebool
            description: "Active flag (boolean)."
          - name: create_date
            description: "Date the customer record was created."
          - name: last_update
            description: "Last update timestamp."
          - name: active
            description: "Active status (integer)."

      - name: film
        description: "Film-level metadata."
        columns:
          - name: film_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: title
            description: "Title of the film."
          - name: description
            description: "Film description."
          - name: release_year
            description: "Year of release."
          - name: language_id
            description: "Language ID."
          - name: original_language_id
            description: "Original language (if different)."
          - name: rental_duration
            description: "Number of days for rental."
          - name: rental_rate
            description: "Rental price."
          - name: length
            description: "Duration of the film in minutes."
          - name: replacement_cost
            description: "Cost to replace the film."
          - name: rating
            description: "MPAA rating."
          - name: last_update
            description: "Last update timestamp."
          - name: special_features
            description: "Extra features of the film."
          - name: fulltext
            description: "Text vector for full search."

      - name: film_actor
        description: "Join table for films and actors."
        columns:
          - name: actor_id
            description: "Foreign key to actor."
          - name: film_id
            description: "Foreign key to film."
          - name: last_update
            description: "Last update timestamp."

      - name: film_category
        description: "Join table for films and categories."
        columns:
          - name: film_id
            description: "Foreign key to film."
          - name: category_id
            description: "Foreign key to category."
          - name: last_update
            description: "Last update timestamp."

      - name: inventory
        description: "Inventory of films at stores."
        columns:
          - name: inventory_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: film_id
            description: "Film in inventory."
          - name: store_id
            description: "Store where inventory is held."
          - name: last_update
            description: "Last update timestamp."

      - name: language
        description: "Languages available for films."
        columns:
          - name: language_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: name
            description: "Language name."
          - name: last_update
            description: "Last update timestamp."

      - name: payment
        description: "Payments made by customers."
        columns:
          - name: payment_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Customer making payment."
          - name: staff_id
            description: "Staff who processed payment."
          - name: rental_id
            description: "Associated rental ID."
          - name: amount
            description: "Amount paid."
          - name: payment_date
            description: "Payment timestamp."

      - name: rental
        description: "Rental transactions."
        columns:
          - name: rental_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: rental_date
            description: "Timestamp of rental."
          - name: inventory_id
            description: "Inventory item being rented."
          - name: customer_id
            description: "Customer who rented."
          - name: return_date
            description: "Timestamp of return."
          - name: staff_id
            description: "Staff who handled rental."
          - name: last_update
            description: "Last update timestamp."

      - name: staff
        description: "Store employees."
        columns:
          - name: staff_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: first_name
            description: "First name."
          - name: last_name
            description: "Last name."
          - name: address_id
            description: "Address of staff."
          - name: email
            description: "Staff email."
          - name: store_id
            description: "Store they work in."
          - name: active
            description: "Active flag."
          - name: username
            description: "Login username."
          - name: password
            description: "Login password (if stored)."
          - name: last_update
            description: "Last update timestamp."
          - name: picture
            description: "Binary photo data."

      - name: store
        description: "Physical rental store locations."
        columns:
          - name: store_id
            description: "Primary key."
            tests:
              - unique
              - not_null
          - name: manager_staff_id
            description: "Staff managing the store."
          - name: address_id
            description: "Location of the store."
          - name: last_update
            description: "Last update timestamp."
